[project]
name = "rag-2.0"
version = "1.0.0"
description = "智能文档处理与知识库构建系统"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "paddleocr>=2.9.0",
    "paddlepaddle>=3.0.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "sentence-transformers>=3.3.0",
    "pymilvus>=2.4.0",
    "lancedb>=0.17.0",
    "neo4j>=5.26.0",
    "minio>=7.2.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "ragas>=0.2.0",
    "jieba>=0.42.1",
    "opencv-python-headless>=4.10.0",
    "pillow>=11.0.0",
    "python-docx>=1.1.0",
    "numpy>=2.1.0",
    "scikit-learn>=1.5.0",
    "httpx>=0.28.0",
    "aiofiles>=24.1.0",
    "python-multipart>=0.0.12",
    "prometheus-client>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.10.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
