services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8000:8000"
    # 全部 RAG_* 配置经 .env 注入容器 (本地开发环境变量与容器共用一份)
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - HF_HOME=/app/.cache/huggingface
      - RAG_API_KEY_ENABLED=true
    volumes:
      # 源码局部挂载 (热重载), 不全量 ./:/app — 否则遮蔽镜像内 /app/.cache 预下载模型,
      # TRANSFORMERS_OFFLINE=1 下 dev 容器模型加载必失败
      - ./api:/app/api
      - ./engines:/app/engines
      - ./web:/app/web
      - ./data:/app/data
      - ./lancedb_data:/app/lancedb_data
      - model_cache:/app/.cache
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  model_cache:
