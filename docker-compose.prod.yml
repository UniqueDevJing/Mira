# 生产部署变体 — 与 docker-compose.yml (开发) 区分:
# 非 root / 无 bind mount / 无 --reload / healthcheck / restart / 资源限制 / 日志轮转
#
# 用法: docker compose -f docker-compose.prod.yml up -d --build

services:
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    image: rag-2.0-api:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - HF_ENDPOINT=https://hf-mirror.com
      - TRANSFORMERS_OFFLINE=1
      - HF_HUB_OFFLINE=1
      - RAG_API_KEY_ENABLED=true
    # 非 root (Dockerfile 已建 uid 1000 appuser)
    user: "1000:1000"
    # 数据持久化: SQLite + 向量库 + BM25 (named volume, 不挂源码)
    volumes:
      - rag_data:/app/data
      - rag_lancedb:/app/lancedb_data
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  rag_data:
  rag_lancedb:
