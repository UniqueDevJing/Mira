name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # dev extras 带入 pytest-cov，使 80% 覆盖率门禁可在 CI 中真实生效
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # ruff 仅作质量门禁提示；不阻断主流程（保证 CI 不因人品问题变红）
      - name: Lint (ruff)
        run: ruff check . || true

      - name: Run tests (with coverage gate)
        # 跳过需真实模型/网络的 slow/integration 测试；--cov-fail-under=80 低于 80% 即失败
        env:
          HF_ENDPOINT: "https://hf-mirror.com"
          RAG_API_KEY_ENABLED: "false"
        run: make test-ci
