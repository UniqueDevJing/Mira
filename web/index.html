<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<title>RAG Agent — 知识库问答</title>
<link rel="icon" href="data:,">
<script>
(function(){
  try { var t = localStorage.getItem('rag_theme');
    if (t !== 'light' && t !== 'dark') t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  } catch(e) { document.documentElement.setAttribute('data-theme', 'light'); }
})();
</script>
<link rel="stylesheet" href="/web/common.css">
<style>
/* ── 主内容区 ── */
.main-content { display: flex; flex-direction: column; }

/* ── 滚动消息流 ── */
.chat-flow {
  flex: 1; overflow-y: auto; padding: 24px 24px 0;
  display: flex; flex-direction: column;
}

/* ── 空状态（居中） ── */
.empty-state {
  display: none; flex-direction: column; align-items: center; justify-content: center;
  flex: 1; padding: 40px 24px; gap: 28px; min-height: 200px;
}
.empty-state.show { display: flex; }
.brand-center { text-align: center; }
.welcome-title {
  font-size: 26px; font-weight: 700; color: var(--text); margin: 12px 0 6px; letter-spacing: -.02em;
}
.welcome-subtitle { font-size: 14px; color: var(--text-2); margin-bottom: 4px; }
.upload-hint { font-size: 12px; color: var(--text-3); }

/* ── 侧边上传按钮（在侧栏已有） ── */
.sidebar-upload-btn {
  width: 100%; padding: 8px 12px; margin-top: 8px;
  background: rgba(99,102,241,.08); border: 1px solid var(--border-active);
  border-radius: var(--radius-sm); color: var(--primary); font-size: 13px;
  cursor: pointer; font-family: inherit; text-align: left;
  display: flex; align-items: center; gap: 8px; transition: background .15s;
}
.sidebar-upload-btn:hover { background: rgba(99,102,241,.14); }
.sidebar-upload-btn span { opacity: .7; }

/* ── 文档列表（侧栏底部固定） ── */
.kb-files-bar {
  margin-top: auto; padding: 12px; border-top: 1px solid var(--border-subtle);
}
.kb-files-label {
  font-size: 11px; color: var(--text-3); text-transform: uppercase; letter-spacing: .05em;
  margin-bottom: 6px; font-weight: 600; display: flex; align-items: center; justify-content: space-between;
}
.kb-files-count { font-size: 10px; padding: 1px 6px; border-radius: 8px;
  background: rgba(99,102,241,.12); color: var(--primary); font-weight: 600; }
.kb-file-list { max-height: 160px; overflow-y: auto; }
.kb-file-item {
  display: flex; align-items: center; gap: 6px; padding: 4px 8px; margin-bottom: 2px;
  border-radius: var(--radius-sm); font-size: 12px; cursor: default; transition: background .1s;
}
.kb-file-item:hover { background: var(--bg-card-hover); }
.kb-file-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-2); }
.kb-file-status { font-size: 10px; padding: 0 6px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
.status-processing { background: rgba(245,158,11,.12); color: var(--warn); }
.status-ready { background: rgba(34,197,94,.12); color: var(--ok); }
.status-failed { background: rgba(239,68,68,.12); color: var(--danger); }
.status-upload { background: rgba(99,102,241,.12); color: var(--primary); }
.kb-empty-msg { font-size: 12px; color: var(--text-3); padding: 4px 0; }

/* ── 多 Agent 框架卡片: 投诉工单 / 待确认操作 ── */
.ticket-card{margin:10px 0 4px;padding:10px 12px;border-radius:10px;font-size:13px;
  background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.35);}
.ticket-card.escalated{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.4);}
.ticket-card.pending-op{background:rgba(99,102,241,.08);border-color:rgba(99,102,241,.4);}
.ticket-card .ticket-title{font-weight:600;margin-bottom:4px;}
.ticket-card .ticket-meta{color:var(--text-3);font-size:12px;margin-bottom:6px;}
.ticket-card .confirm-op-btn{margin-top:2px;}

@media (max-width: 768px) {
  .chat-flow { padding: 16px 12px 0; }
  .input-area { padding: 0 12px 12px; }
  .empty-state { padding: 24px 16px; }
}

/* 长会话裁剪占位提示 */
.hidden-msgs-ph{padding:8px 12px;margin:4px 0;font-size:12px;color:var(--text-3);text-align:center;
  background:var(--bg-card);border:1px dashed var(--border-subtle);border-radius:var(--radius-sm);cursor:default;}
  /* 回到底部浮动按钮 */
  .main-content{position:relative;}
  .scroll-bottom-btn{position:absolute;left:50%;transform:translateX(-50%);bottom:84px;z-index:20;
    padding:6px 14px;border-radius:999px;border:1px solid var(--border-active);background:var(--bg-card);
    color:var(--primary);font-size:12px;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.18);transition:opacity .15s;}
  .scroll-bottom-btn[hidden]{display:none;}
</style>
</head>
<body>
<div class="app-layout">

<!-- 侧栏：会话 + 文档管理 -->
<aside id="sidebar" class="sidebar">
  <div class="sidebar-inner">
    <div class="sidebar-header">
      <button id="newChatBtn" class="new-chat-btn"><span>&#10010;</span> 新对话</button>
    </div>
    <div id="sessionList" class="session-list"></div>

    <!-- 上传入口（侧栏底部） -->
    <div class="kb-files-bar">
      <div class="kb-files-label">
        <span>知识库文档</span>
        <span class="kb-files-count" id="kbCount">0</span>
      </div>
      <div id="kbFileList" class="kb-file-list"><div class="kb-empty-msg">暂无文档</div></div>
      <button class="sidebar-upload-btn" id="sidebarUploadBtn">
        <span>&#43;</span> 上传文件到知识库
      </button>
    </div>

    <div class="sidebar-footer">
      <input id="apiKeyInput" class="sidebar-key-input" placeholder="API Key" spellcheck="false">
      <div class="sidebar-actions">
        <button class="nav-link" id="metricsOpenBtn" title="系统指标（切分策略 / 核心指标 / 降级分布）" aria-label="系统指标"></button>
        <a class="nav-link" href="/admin" title="管理后台"><i class="fa fa-cog"></i></a>
        <button id="themeToggle" class="icon-btn" title="切换主题"></button>
      </div>
    </div>
  </div>
</aside>

<div id="resizeHandle" class="resize-handle"></div>

<!-- 主区域：对话 + 输入 -->
<main id="mainContent" class="main-content">
  <div id="chatFlow" class="chat-flow">
    <!-- 消息容器 -->
    <div id="chatContainer"></div>
    <!-- 空状态：居中展示 -->
    <div id="emptyState" class="empty-state">
      <div class="brand-center">
        <span class="brand-dot-lg"></span>
        <h1 class="welcome-title">RAG Agent</h1>
        <p class="welcome-subtitle">知识库问答</p>
        <p class="upload-hint">从左侧面板上传文档到知识库开始对话</p>
      </div>
    </div>
  </div>

  <button id="scrollBottomBtn" class="scroll-bottom-btn" hidden aria-label="回到底部">↓ 新消息</button>

  <!-- 输入框：固定底部 -->
  <footer id="inputAreaWrap" class="input-area">
    <div class="input-container" id="inputWrapper">
      <input type="file" id="fileInput" class="hidden" accept=".pdf,.md,.markdown,.txt,.docx,image/png,image/jpeg,image/webp" multiple>
      <button id="uploadTrigger" class="upload-trigger icon-btn" title="上传文件到知识库 / 选择图片提问"></button>
      <textarea id="questionInput" rows="1" placeholder="基于知识库提问..." autocomplete="off"></textarea>
      <button id="sendBtn" class="send-btn" title="发送" disabled></button>
      <button id="stopBtn" class="stop-btn" title="停止生成"></button>
    </div>
  </footer>
</main>
</div>

<!-- 系统指标面板: ①切分策略 ②核心指标 ③单轮耗时 ④降级/异常分布 -->
<div id="metricsOverlay" class="metrics-overlay" hidden>
  <div class="metrics-panel" role="dialog" aria-modal="true" aria-label="系统指标">
    <div class="metrics-head">
      <h2>系统指标</h2>
      <div class="metrics-head-actions">
        <button id="metricsRefreshBtn" class="icon-btn" title="刷新数据"></button>
        <button id="metricsCloseBtn" class="icon-btn" title="关闭"></button>
      </div>
    </div>
    <div class="metrics-body" id="metricsBody">
      <div class="metrics-loading">正在加载指标…</div>
    </div>
  </div>
</div>

<script src="/web/common.js"></script>
<script src="/web/icons.js"></script>
<script src="/web/markdown.js"></script>
<script>
(function(){
  'use strict';
  var RAG = window.RAG;
  if (!RAG || !RAG.authHeaders) return;

  var API = RAG.API || '/api/v1';
  var currentController = null, chatHistory = [], isStreaming = false, currentSid = '';
  var uploadedDocs = {}, localUploads = [];

  var $ = function(id){ return document.getElementById(id); };
  var questionInput = $('questionInput'), sendBtn = $('sendBtn'), stopBtn = $('stopBtn');
  var chatContainer = $('chatContainer'), chatFlow = $('chatFlow'), emptyState = $('emptyState');
  var sidebarUploadBtn = $('sidebarUploadBtn'), kbCount = $('kbCount'), kbFileList = $('kbFileList');
  var apiKeyInput = $('apiKeyInput'), themeToggle = $('themeToggle'), newChatBtn = $('newChatBtn'), scrollBottomBtn = $('scrollBottomBtn');
  var sessionList = $('sessionList'), resizeHandle = $('resizeHandle');
  var uploadTrigger = $('uploadTrigger'), fileInput = $('fileInput');

  function init() {
    apiKeyInput.value = localStorage.getItem('rag_api_key') || '';
    if (typeof RAG.updateThemeIcon === 'function') RAG.updateThemeIcon();
    loadSessions(); showEmptyState(); setupEvents();
    initMetricsPanel();   // 绑定「系统指标」按钮 / 关闭 / 刷新 / Esc, 否则面板不可达
  }

  function _getSessions(){ try { return JSON.parse(localStorage.getItem('rag_sessions') || '[]'); } catch(e){ return []; } }
  function _saveSessions(sessions){ localStorage.setItem('rag_sessions', JSON.stringify(sessions)); }
  function _nowISO(){ return new Date().toISOString(); }

  /* ── Session ── */
  function loadSessions(){ renderSessionList(_getSessions()); }

  function renderSessionList(sessions){
    sessionList.innerHTML = '';
    if (!sessions) return;
    sessions.forEach(function(s){
      var div = document.createElement('div');
      div.className = 'session-item' + (s.session_id === currentSid ? ' active' : '');
      div.setAttribute('data-session-id', s.session_id);
      div.title = s.title || s.session_id.slice(-8);
      var timeStr = RAG.timeAgo(s.updated_at);
      var nameEl = s.title || s.session_id.slice(-8);
      div.innerHTML = '<div class="session-info">' +
        '<div class="session-title">' + escapeAttr(nameEl) + '</div>' +
        '<div class="session-time">' + timeStr + '</div></div>' +
        '<button class="del-session icon-btn" title="删除此对话" aria-label="删除">' + RAG.icon('trash') + '</button>';
      div.addEventListener('click', function(e){ if(!e.target.closest('.del-session')) switchSession(s.session_id); });
      div.querySelector('.del-session').addEventListener('click', function(e){ e.stopPropagation(); deleteSession(s.session_id, div); });
      div.addEventListener('dblclick', function(){
        var titleEl = div.querySelector('.session-title'), oldText = titleEl.textContent;
        var inp = document.createElement('input');
        inp.type='text'; inp.value=oldText; inp.className='session-rename-input';
        titleEl.replaceWith(inp); inp.focus(); inp.select();
        inp.addEventListener('blur', function(){
          var nv = inp.value.trim();
          if(nv&&nv!==oldText) renameSessionLocal(s.session_id, nv);
          var ndiv=document.createElement('div'); ndiv.className='session-title'; ndiv.textContent=nv||oldText;
          inp.replaceWith(ndiv); renderSessionList(_getSessions());
        });
        inp.addEventListener('keydown', function(kb){ if(kb.key==='Enter'){kb.preventDefault();inp.blur();} if(kb.key==='Escape'){inp.value=oldText;inp.blur();} });
      });
      sessionList.appendChild(div);
    });
  }

  function renameSessionLocal(sid, newName){
    var sessions=_getSessions();
    for(var i=0;i<sessions.length;i++){if(sessions[i].session_id===sid){sessions[i].title=newName;sessions[i].updated_at=_nowISO();break;}}
    _saveSessions(sessions);
  }

  function deleteSession(sid, el){
    fetch(API+'/qa/session/'+encodeURIComponent(sid),{method:'DELETE',headers:RAG.authHeaders()})
      .then(function(r){if(!r.ok)throw new Error();})
      .then(function(){var sessions=_getSessions();var filtered=[];for(var i=0;i<sessions.length;i++){if(sessions[i].session_id!==sid)filtered.push(sessions[i]);}_saveSessions(filtered);loadSessions();if(sid===currentSid){resetAndShowEmpty();}}).catch(function(){});
  }

  function switchSession(sid){ currentSid=sid; localStorage.setItem('rag_session_id',sid); loadSessions(); loadConversation(sid); }

  function createNewSession(){
    currentSid=RAG.getSessionId(); localStorage.setItem('rag_session_id',currentSid);
    var sessions=_getSessions();
    sessions.unshift({session_id:currentSid,title:'新对话',created_at:_nowISO(),updated_at:_nowISO()});
    _saveSessions(sessions); chatHistory=[]; loadSessions(); showEmptyState();
  }

  function resetAndShowEmpty(){
    currentSid=RAG.getSessionId(); localStorage.setItem('rag_session_id',currentSid);
    chatHistory=[]; chatContainer.innerHTML=''; showEmptyState();
  }

  function showEmptyState(){
    emptyState.classList.add('show');
  }
  function hideEmptyState(){
    emptyState.classList.remove('show');
  }

  function loadConversation(sid){
    chatContainer.innerHTML=''; chatHistory=[]; hideEmptyState();
    fetch(API+'/qa/session/'+encodeURIComponent(sid),{method:'GET',headers:RAG.authHeaders()})
      .then(function(r){if(!r.ok)return;return r.json();})
      .then(function(data){
        if(data&&data.history&&data.history.length){
          renderRestoredMessages(data.history); chatHistory=data.history.slice(-20);
          var sessions=_getSessions();
          for(var i=0;i<sessions.length;i++){
            if(sessions[i].session_id===sid){
              for(var j=0;j<data.history.length;j++){if(data.history[j].role==='user'){sessions[i].title=data.history[j].content.slice(0,60);break;}}
              sessions[i].updated_at=_nowISO(); break;
            }
          }
          _saveSessions(sessions); renderSessionList(sessions);
        } else { showEmptyState(); }
      }).catch(function(){showEmptyState();});
    loadKnowledgeBase();
  }

  function renderRestoredMessages(history){
    history.forEach(function(msg){
      if(msg.role==='user')appendUserMessage(msg.content);
      else if(msg.role==='assistant')appendRestoredAssistantMessage(msg.content);
    });
  }

  /* ── Knowledge Base ── */
  async function loadKnowledgeBase(){
    try{
      var r=await fetch(API+'/documents',{headers:RAG.authHeaders()});
      if(!r.ok)return;
      var data=await r.json();
      var prevKeys={};for(var k in uploadedDocs)prevKeys[k]=true;
      uploadedDocs={};
      (data.items||[]).forEach(function(d){
        uploadedDocs[d.doc_id]={name:d.filename,status:d.status,kb:d.knowledge_base||'documents'};
      });
      for(var k in prevKeys){if(!uploadedDocs[k])delete uploadedDocs[k];}
      kbCount.textContent=data.total;
      renderKBFiles(data.items);
      startKBPolling();
    }catch(e){}
  }

  function renderKBFiles(docs){
    if(!docs||!docs.length){ kbFileList.innerHTML='<div class="kb-empty-msg">暂无文档</div>'; return; }
    kbFileList.innerHTML=docs.map(function(d){
      var sc=d.status==='ready'?'status-ready':(d.status==='processing'?'status-processing':'status-failed');
      var st=d.status==='ready'?'就绪':(d.status==='processing'?'解析中':'失败');
      return '<div class="kb-file-item"><span class="kb-file-name" title="'+RAG.escapeHtml(d.filename)+'">'+RAG.icon('file-text')+' '+RAG.escapeHtml(d.filename)+'</span><span class="kb-file-status '+sc+'">'+st+'</span></div>';
    }).join('');
  }

  var kbPollTimer=null;
  function startKBPolling(){
    if(kbPollTimer)clearInterval(kbPollTimer);
    kbPollTimer=setInterval(function(){
      loadKnowledgeBase().then(function(){
        var hasProcessing=false;
        for(var id in uploadedDocs){if(uploadedDocs[id].status==='processing'){hasProcessing=true;break;}}
        if(!hasProcessing&&kbPollTimer){clearInterval(kbPollTimer);kbPollTimer=null;}
      }).catch(function(){if(kbPollTimer){clearInterval(kbPollTimer);kbPollTimer=null;}});
    },3000);
  }

  /* ── File Upload ── */
  function handleKBUpload(files){
    if(!files||!files.length)return;
    for(var i=0;i<files.length;i++){
      var f=files[i];
      if(f.size>50*1024*1024){RAG.toast('文件过大: '+RAG.formatBytes(f.size)+'，上限 50MB','err');continue;}
      var ext=f.name.split('.').pop().toLowerCase();
      if(!/^(pdf|docx|md|markdown|txt)$/.test(ext)){RAG.toast('不支持的格式: .'+ext,'err');continue;}
      uploadSingleFile(f);
    }
  }

  function uploadSingleFile(file){
    var fd=new FormData();fd.append('file',file);fd.append('knowledge_base','documents');
    var tempId='temp_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);
    localUploads.push({id:tempId,name:file.name,size:file.size,status:'uploading'});
    updateUploadedFilesView();
    fetch(API+'/documents/upload',{method:'POST',body:fd,headers:RAG.authHeaders()})
      .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
      .then(function(data){
        for(var i=0;i<localUploads.length;i++){if(localUploads[i].id===tempId){localUploads.splice(i,1);break;}}
        uploadedDocs[data.doc_id]={name:file.name,status:data.status};
        RAG.toast('上传成功: '+file.name,'ok');
        updateUploadedFilesView();loadKnowledgeBase();
      })
      .catch(function(err){
        for(var i=0;i<localUploads.length;i++){if(localUploads[i].id===tempId){localUploads.splice(i,1);break;}}
        updateUploadedFilesView();RAG.toast('上传失败: '+err.message,'err');
      });
  }

  function updateUploadedFilesView(){
    // 不单独显示列表了，只在侧栏底部署名
  }

  /* ── Events ── */
  function setupEvents(){
    if(themeToggle&&!themeToggle.dataset.bound){
      themeToggle.dataset.bound='1';
      themeToggle.addEventListener('click',function(){RAG.toggleTheme();if(typeof RAG.updateThemeIcon==='function')RAG.updateThemeIcon();});
    }
    apiKeyInput.addEventListener('change',function(){localStorage.setItem('rag_api_key',apiKeyInput.value.trim());});
    newChatBtn.addEventListener('click',createNewSession);

    // 侧栏上传按钮
    sidebarUploadBtn.addEventListener('click',function(){fileInput.click();});
    // 输入框中的上传按钮
    if(uploadTrigger)uploadTrigger.addEventListener('click',function(){fileInput.click();});
    if(fileInput)fileInput.addEventListener('change',function(){
      if(!fileInput.files.length)return;
      var files=Array.from(fileInput.files);
      var img=files.find(function(f){return f.type&&f.type.indexOf('image/')===0;});
      if(img){askWithImage(img);}else{handleKBUpload(files);}
      fileInput.value='';
    });

    questionInput.addEventListener('input',function(){autoResize(questionInput);toggleSendBtn();});
    questionInput.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!isStreaming){e.preventDefault();askQuestion();}});
    sendBtn.addEventListener('click',function(){if(!sendBtn.disabled)askQuestion();});
    stopBtn.addEventListener('click',function(){if(currentController)stopGeneration();});

    document.addEventListener('click',function(e){
      var copyBtn=e.target.closest('[data-copy-answer]');
      if(copyBtn){
        var wrap=copyBtn.closest('[data-answer-id]');
        var id=wrap?wrap.getAttribute('data-answer-id'):'';
        var text=id?(_answerCache[id]||''):'';
        RAG.copyText(text).then(function(ok){RAG.toast(ok?'已复制到剪贴板':'复制失败',ok?'ok':'err');});
        return;
      }
    });

    // 代码块复制 + 重新生成
    document.addEventListener('click',function(e){
      var codeBtn=e.target.closest('[data-copy-code]');
      if(codeBtn){
        var block=codeBtn.closest('.code-block');
        var codeEl=block?block.querySelector('pre code'):null;
        var text=(codeEl?codeEl.textContent:'')||'';
        RAG.copyText(text).then(function(ok){RAG.toast(ok?'代码已复制':'复制失败',ok?'ok':'err');});
        return;
      }
      var regenBtn=e.target.closest('[data-regenerate]');
      if(regenBtn){
        var awrap=regenBtn.closest('[data-answer-id]');
        var aid=awrap?awrap.getAttribute('data-answer-id'):'';
        if(aid)regenerate(aid);
        return;
      }
      var confirmBtn=e.target.closest('.confirm-op-btn');
      if(confirmBtn){
        confirmPendingOperation(confirmBtn.getAttribute('data-pending-id'),confirmBtn);
        return;
      }
    });

    /* ── 多 Agent: 高危操作二次确认 ── */
    function confirmPendingOperation(pid,btn){
      if(!pid||btn){btn.disabled=true;btn.textContent='执行中...';}
      fetch(API+'/qa/ask',{
        method:'POST',headers:Object.assign({'Content-Type':'application/json'},RAG.authHeaders()),
        body:JSON.stringify({question:_lastQuestion||'确认执行操作',confirm_operation:true,pending_operation_id:pid,session_id:RAG.getSessionId()})
      }).then(function(r){return r.json();}).then(function(d){
        appendAssistantMessage(d.answer||'操作完成');
        if(btn&&btn.closest('.ticket-card'))btn.closest('.ticket-card').remove();
      }).catch(function(){RAG.toast('确认请求失败','err');if(btn){btn.disabled=false;btn.textContent='确认执行';}});
    }

    function appendAssistantMessage(content){
      var div=document.createElement('div');div.className='msg msg-assistant';
      div.innerHTML='<div class="msg-body"><div class="answer-text">'+RAG.renderMarkdown(content)+'</div></div>'+
        '<div class="msg-avatar">'+RAG.icon('robot')+'</div>';
      chatContainer.appendChild(div);scrollToBottom();
      chatHistory.push({role:'assistant',content:content});
    }

    /* ── 多模态: 图片提问 (OCR 后并入问题, 走非流式 /ask) ── */
    function askWithImage(file){
      var reader=new FileReader();
      reader.onload=function(){
        var base64=String(reader.result||'').split(',')[1]||'';
        var question=questionInput.value.trim()||'请看图片里的内容';
        appendUserMessage('🖼 [图片] '+question);
        chatHistory.push({role:'user',content:question});
        questionInput.value='';autoResize(questionInput);toggleSendBtn();hideEmptyState();
        createStreamingCard();setPipelineStep('route','active');updateUIState(true);
        fetch(API+'/qa/ask',{
          method:'POST',headers:Object.assign({'Content-Type':'application/json'},RAG.authHeaders()),
          body:JSON.stringify({question:question,image_base64:base64,top_k:5,session_id:RAG.getSessionId()})
        }).then(function(r){return r.json();}).then(function(d){
          finalizeAnswer(d.answer||'(无内容)',{message_type:d.message_type||'consult',agent:d.agent||'rag',kb_id:d.kb_id,routing_source:d.routing_source,done:d},(d.sources||[]).map(function(s){return{title:s.id,score:s.score};}),d.retrieval_meta);
        }).catch(function(err){handleError((err&&err.message)||'图片提问失败');});
      };
      reader.readAsDataURL(file);
    }

    if(chatFlow)chatFlow.addEventListener('scroll',_onChatScroll);
    if(scrollBottomBtn)scrollBottomBtn.addEventListener('click',function(){if(chatFlow)chatFlow.scrollTop=chatFlow.scrollHeight;_autoScroll=true;scrollBottomBtn.hidden=true;});
    setupResize();
    loadKnowledgeBase();
  }

  function setupResize(){
    if(!resizeHandle)return;
    var isResizing=false;
    resizeHandle.addEventListener('mousedown',function(e){isResizing=true;document.body.style.cursor='col-resize';e.preventDefault();});
    document.addEventListener('mousemove',function(e){
      if(!isResizing)return;var w=Math.max(200,Math.min(420,e.clientX));$('sidebar').style.width=w+'px';resizeHandle.style.left=w+'px';
    });
    document.addEventListener('mouseup',function(){if(isResizing){isResizing=false;document.body.style.cursor='';}});
  }

  /* ── Ask & Stream ── */
  function askQuestion(){
    var question=questionInput.value.trim();if(!question)return;
    _lastQuestion=question;
    if(currentController){currentController.abort();currentController=null;isStreaming=false;}
    appendUserMessage(question);chatHistory.push({role:'user',content:question});
    questionInput.value='';autoResize(questionInput);toggleSendBtn();hideEmptyState();
    startStream(question);
    var sessions=_getSessions(),found=false;
    for(var i=0;i<sessions.length;i++){
      if(sessions[i].session_id===currentSid){sessions[i].title=question.slice(0,60);sessions[i].updated_at=_nowISO();found=true;break;}
    }
    // 首次提问时当前会话尚未登记 (rag_sessions 仅由"新对话"写入) → 补建, 否则首条消息不落盘
    if(!found)sessions.unshift({session_id:currentSid,title:question.slice(0,60),created_at:_nowISO(),updated_at:_nowISO()});
    _saveSessions(sessions);loadSessions();
  }

  function startStream(question){
    _streamFull='';_streamDirty=false;_firstDeltaSeen=false;_streamNode=null;_vizMounted=false;
    createStreamingCard(); setPipelineStep('route','active'); updateUIState(true);
    var controller=new AbortController();currentController=controller;isStreaming=true;
    fetch(API+'/qa/ask/stream',{
      method:'POST',headers:Object.assign({'Content-Type':'application/json'},RAG.authHeaders()),signal:controller.signal,
      body:JSON.stringify({question:question,top_k:5,temperature:0.3,mode:'hybrid',session_id:RAG.getSessionId(),history:chatHistory.slice(-20)})
    })
    .then(function(r){
      if(!r.ok)throw new Error('HTTP '+r.status);
      var reader=r.body.getReader(),decoder=new TextDecoder(),buf='',metaInfo={},sourcesList=[],retrievalMeta=null;
      function pump(){
        return reader.read().then(function(result){
          if(result.done){finalizeAnswer(_streamFull,metaInfo,sourcesList,retrievalMeta);return;}
          buf+=decoder.decode(result.value,{stream:true});
          var events=RAG.parseSSEStream(buf);buf='';
          events.forEach(function(ev){
            if(ev.type==='meta'){
              metaInfo=ev;
              metaInfo.message_type=ev.message_type||'consult';
              metaInfo.agent=ev.agent||'rag';
              if(metaInfo.message_type!=='consult'){
                // Agent 接管: 闲聊/投诉/操作不走检索链路, 步骤条直接收尾
                setPipelineStep('route','done');setPipelineStep('retrieve','skip');setPipelineStep('rerank','skip');setPipelineStep('generate','active');
              } else {
                setPipelineStep('route','done');
                setPipelineStep('retrieve','active');
              }
            }
            else if(ev.type==='delta'){
              if(!_firstDeltaSeen){_firstDeltaSeen=true;setPipelineStep('generate','active');}
              updateStreamingAnswer(ev.content||'');
            }
            else if(ev.type==='sources'){sourcesList=ev.sources||[];retrievalMeta=ev.retrieval_meta||null;setPipelineStep('retrieve','done');setPipelineStep('rerank','active');mountRetrievalViz(metaInfo,sourcesList,retrievalMeta);}
            else if(ev.type==='done')metaInfo.done=ev;
            else if(ev.type==='error')handleError(ev.detail||'生成出错');
          });
          return pump();
        }).catch(function(err){if(err.name==='AbortError')clearThinking();else handleError(err.message||'网络错误');});
      }
      return pump();
    }).catch(function(err){if(err.name!=='AbortError')handleError(err.message);});
  }

  function appendUserMessage(content){
    var div=document.createElement('div');div.className='msg msg-user';
    div.innerHTML='<div class="msg-body">'+RAG.escapeHtml(content)+'</div>' +
      '<div class="msg-avatar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div>';
    chatContainer.appendChild(div);scrollToBottom();trimOldMessages();
  }

  var _pipelineEl=null;        // 检索过程渐进可视化的步骤容器引用
  var _vizMounted=false;       // 检索可视化面板是否已在当前流挂载(每轮仅挂一次), 防止 sources 重复到达重复渲染
  function showThinking(){
    var div=document.createElement('div');div.className='msg msg-assistant';div.id='thinkingMsg';
    div.innerHTML='<div class="msg-avatar">'+RAG.icon('robot')+'</div><div class="msg-body">'+
      '<div class="pipeline-steps" id="pipelineSteps">'+
        '<span class="pstep pending" data-step="route">路由</span>'+
        '<span class="pstep pending" data-step="retrieve">检索</span>'+
        '<span class="pstep pending" data-step="rerank">重排</span>'+
        '<span class="pstep pending" data-step="generate">生成</span>'+
      '</div></div>';
    chatContainer.appendChild(div);scrollToBottom();
    _pipelineEl=document.getElementById('pipelineSteps');
    setPipelineStep('route','active');
  }
  function setPipelineStep(step,state){
    if(!_pipelineEl)return;
    var el=_pipelineEl.querySelector('[data-step="'+step+'"]');
    if(!el)return;
    el.className='pstep '+state;
  }

  function clearThinking(){var el=document.getElementById('thinkingMsg');if(el)el.remove();}

  var _streamNode=null;
  var _streamFull='';          // 流式累计全文(单一真相源)
  var _streamDirty=false;       // rAF 合并标记: 每帧最多重渲一次 markdown
  var _answerCache={};          // ansId -> 全文(避免把答案再塞进 DOM 属性导致体积翻倍)
  var _currentAnsId='';
  var _firstDeltaSeen=false;    // 首字节标记: 用于把"生成"步骤切到 active
  var _lastQuestion='';         // 最近一次提问原文, 供"重新生成"回退取问题
  function updateStreamingAnswer(delta){
    if(!_streamNode){createStreamingCard();setPipelineStep('route','active');}
    _streamFull += (delta||'');
    if(!_streamDirty){
      _streamDirty=true;
      requestAnimationFrame(function(){
        _streamDirty=false;
        if(_streamNode)_streamNode.innerHTML=(RAG.renderMarkdown?RAG.renderMarkdown(_streamFull):RAG.escapeHtml(_streamFull));
      });

  function createStreamingCard(){
    var ansId='ans_'+Date.now();
    _currentAnsId=ansId;
    var div=document.createElement('div');div.className='msg msg-assistant';div.id=ansId;
    div.innerHTML='<div class="msg-avatar">'+RAG.icon('robot')+'</div><div class="msg-body">'+
      '<div class="pipeline-steps" id="'+ansId+'_pipe">'+
        '<span class="pstep pending" data-step="route">路由</span>'+
        '<span class="pstep pending" data-step="retrieve">检索</span>'+
        '<span class="pstep pending" data-step="rerank">重排</span>'+
        '<span class="pstep pending" data-step="generate">生成</span>'+
      '</div>'+
      '<div class="answer-text" id="'+ansId+'_text"></div></div>';
    chatContainer.appendChild(div);
    _pipelineEl=document.getElementById(ansId+'_pipe');   // 检索过程芯片常驻于答案卡, 贯穿流式并保留至最终答案
    _streamNode=document.getElementById(ansId+'_text');scrollToBottom();trimOldMessages();
  }

  // 降级等级语义 — 与后端 api/core/orchestrator.py 的定义保持一致, 不臆造
  var DEG_LABELS={0:'正常',1:'Rerank 跳过',2:'仅 BM25',3:'LLM 失败兜底'};
  var DEG_TITLES={0:'全流程正常完成',1:'重排阶段超时/失败, 已跳过重排',2:'向量检索失败, 降级为仅 BM25 关键词检索',3:'LLM 调用失败, 返回检索摘要兜底'};

  function fmtMs(ms){
    ms=Number(ms)||0;
    return ms>=1000?(ms/1000).toFixed(2)+'s':Math.round(ms)+'ms';
  }

  // 块3: 单轮耗时可视化(各阶段堆叠条) + 降级徽章
  // 数据来自 SSE done 事件的 latency_breakdown(router/retrieval/rerank/llm/total_ms) 与 degradation_level
  function buildLatencyViz(done){
    if(!done)return '';
    var lb=done.latency_breakdown||{};
    var total=lb.total_ms||0;var level=done.degradation_level||0;
    var segs=[
      {k:'router_ms',   n:'路由', c:'seg-router'},
      {k:'retrieval_ms',n:'检索', c:'seg-retrieval'},
      {k:'rerank_ms',   n:'重排', c:'seg-rerank'},
      {k:'llm_ms',      n:'LLM',  c:'seg-llm'}
    ];
    var sum=0;segs.forEach(function(s){sum+=(lb[s.k]||0);});
    // 分母用 total_ms (各阶段之和可能小于总耗时: 排队/序列化/网络开销)
    var denom=Math.max(total,sum,1);
    var bar='';
    segs.forEach(function(s){
      var v=lb[s.k]||0;if(v<=0)return;
      var pct=Math.min(100,Math.max(1.5,v/denom*100));   // 最小 1.5% 保证极短阶段仍可见
      bar+='<span class="lat-seg '+s.c+'" style="width:'+pct.toFixed(1)+'%" title="'+s.n+' '+Math.round(v)+'ms"></span>';
    });
    var other=Math.max(0,total-sum);
    if(other>0&&total>0){
      bar+='<span class="lat-seg seg-other" style="width:'+Math.max(1.5,other/denom*100).toFixed(1)+'%" title="其他开销 '+Math.round(other)+'ms"></span>';
    }
    var legend=segs.map(function(s){
      return '<span class="lat-legend"><i class="'+s.c+'"></i>'+s.n+' '+fmtMs(lb[s.k]||0)+'</span>';
    }).join('');
    var degCls=level>0?('deg-l'+level):'deg-ok';
    var degTxt=level>0?('降级 L'+level+' · '+(DEG_LABELS[level]||'')):'正常';
    return '<div class="latency-viz">'+
      '<div class="lat-head">'+
        '<span class="lat-total">本轮耗时 <b>'+fmtMs(total)+'</b></span>'+
        '<span class="deg-badge '+degCls+'" title="'+(DEG_TITLES[level]||'')+'">'+degTxt+'</span>'+
      '</div>'+
      (bar?'<div class="lat-bar">'+bar+'</div><div class="lat-legends">'+legend+'</div>':'')+
    '</div>';
  }

  function finalizeAnswer(fullAnswer,metaInfo,sourcesList,retrievalMeta){
    setPipelineStep('generate','done');
    var reranked=(retrievalMeta&&retrievalMeta.final)||(metaInfo&&metaInfo.rerank_ms>0);
    setPipelineStep('rerank', reranked?'done':'skip');
    isStreaming=false;currentController=null;_streamNode=null;updateUIState(false);   // 芯片保留在答案卡内, 最终态常驻可见
    var pipelineHtml=buildPipeline(metaInfo);
    // 流式阶段若已挂载检索可视化则保留; 否则兜底挂载(避免 sources 缺失时无面板)
    if(!_vizMounted)mountRetrievalViz(metaInfo,sourcesList,retrievalMeta);
    var latencyHtml=buildLatencyViz(metaInfo&&metaInfo.done);
    if(metaInfo&&metaInfo.done)window._ragLastDone=metaInfo.done;   // 供指标面板「本轮」展示
    var actionsHtml='<div class="answer-actions" data-answer-id="'+_currentAnsId+'">'+
      '<button class="action-btn" data-copy-answer title="复制答案">'+RAG.icon('copy')+' 复制</button>'+
      '<button class="action-btn" data-regenerate title="重新生成">'+RAG.icon('refresh')+' 重新生成</button></div>';
    // ── 多 Agent 框架卡片: 投诉工单 / 待确认高危操作 ──
    var extrasHtml='';
    var doneInfo=metaInfo&&metaInfo.done;
    if(doneInfo&&doneInfo.ticket){
      var tk=doneInfo.ticket;
      extrasHtml+='<div class="ticket-card'+(tk.escalated?' escalated':'')+'">'+
        '<div class="ticket-title">🎫 投诉工单 '+RAG.escapeHtml(tk.ticket_id)+'</div>'+
        '<div class="ticket-meta">状态: '+RAG.escapeHtml(tk.status)+' · 情绪等级: '+RAG.escapeHtml(tk.sentiment)+
        (tk.escalated?' · <b>已升级人工</b>':'')+'</div></div>';
    }
    if(doneInfo&&doneInfo.pending_operation){
      var po=doneInfo.pending_operation;
      extrasHtml+='<div class="ticket-card pending-op" data-pending-id="'+RAG.escapeHtml(po.pending_id)+'">'+
        '<div class="ticket-title">⚠️ 待确认操作: '+RAG.escapeHtml(po.label)+'</div>'+
        '<div class="ticket-meta">该操作不可撤销, 请谨慎确认。</div>'+
        '<button class="action-btn confirm-op-btn" data-pending-id="'+RAG.escapeHtml(po.pending_id)+'">确认执行</button></div>';
    }
    var texts=chatContainer.querySelectorAll('.answer-text[id$="_text"]');
    var bodyEl=texts.length>0?texts[texts.length-1].parentElement:null;
    if(bodyEl){
      if(_currentAnsId)_answerCache[_currentAnsId]=fullAnswer;   // 全文存缓存, 复制时读缓存而非 DOM 属性(去重)
      // 仅更新答案文本节点, 保留流式阶段已渲染的 .pipeline-steps(检索过程芯片常驻)与 .retrieval-viz(检索可视化)
      texts[texts.length-1].innerHTML=RAG.renderMarkdown(fullAnswer);
      bodyEl.insertAdjacentHTML('beforeend', extrasHtml+(pipelineHtml?'<div class="pipeline-badge">'+pipelineHtml+'</div>':'')+latencyHtml+actionsHtml);
    }
    chatHistory.push({role:'assistant',content:fullAnswer});scrollToBottom();
  }

  function appendRestoredAssistantMessage(content){
    var div=document.createElement('div');div.className='msg msg-assistant';
    var ansId='ans_'+Date.now()+'_r';div.id=ansId;
    div.innerHTML='<div class="msg-avatar">'+RAG.icon('robot')+'</div><div class="msg-body">'+
      '<div class="answer-text">'+RAG.renderMarkdown(content)+'</div>'+
      '<div class="answer-actions" data-answer-id="'+ansId+'">'+
        '<button class="action-btn" data-copy-answer title="复制答案">'+RAG.icon('copy')+' 复制</button>'+
        '<button class="action-btn" data-regenerate title="重新生成">'+RAG.icon('refresh')+' 重新生成</button>'+
      '</div></div>';
    chatContainer.appendChild(div);
    _answerCache[ansId]=content;
    scrollToBottom();trimOldMessages();
  }

  // 重新生成: 复用 startStream, 问题取自前序用户消息(优先 DOM, 回退 _lastQuestion)。
  // 先移除旧助手气泡与 chatHistory 中对应助手项, 避免重发时上下文残留旧答案。
  function regenerate(ansId){
    if(isStreaming)return;
    var ansDiv=document.getElementById(ansId);if(!ansDiv)return;
    var q=_lastQuestion;
    var prev=ansDiv.previousElementSibling;
    if(prev&&prev.classList.contains('msg-user')){
      var pt=prev.querySelector('.msg-body');q=(pt?pt.textContent:'').trim()||q;
    }
    for(var i=chatHistory.length-1;i>=0;i--){if(chatHistory[i].role==='assistant'){chatHistory.splice(i,1);break;}}
    delete _answerCache[ansId];ansDiv.remove();
    if(q)startStream(q);
  }

  function intentLabel(t){
    return {consult:'咨询',chat:'闲聊',complaint:'投诉',operation:'操作'}[t]||t;
  }
  function buildPipeline(meta){
    var routing=meta.routing_source||'';var kbId=meta.kb_id||'';var degLevel=meta.degradation_level||0;var steps=[];
    if(meta.message_type&&meta.message_type!=='consult'){
      steps.push('<span class="pipeline-step done" title="意图分类">意图: '+intentLabel(meta.message_type)+'</span>');
      steps.push('<span class="pipeline-step done" title="执行 Agent">Agent: '+(meta.agent||'agent')+'</span>');
      if(meta.agent==='chitchat'){steps.push('<span class="pipeline-step done">直达 LLM (未检索)</span>');return steps.join('');}
    }
    steps.push('<span class="pipeline-step done">'+(routing||'路由')+'</span>');
    if(kbId)steps.push('<span class="pipeline-step done">'+kbId+(degLevel>0?' L'+degLevel:'')+'</span>');
    if(meta.rerank_ms)steps.push('<span class="pipeline-step done">重排 '+meta.rerank_ms+'ms</span>');
    else if(degLevel===1)steps.push('<span class="pipeline-step waiting">重排 跳过</span>');
    steps.push('<span class="pipeline-step executing">LLM</span>');
    return steps.join('');
  }

  // ── 检索过程数据可视化: 真实召回片段 + 分数条 + 路由/重排状态 (数据驱动, 非抽象状态指示) ──
  function mountRetrievalViz(meta, sources, rmeta){
    if(_vizMounted) return;
    try{
      var at=_streamNode; if(!at) return;
      var body=at.parentElement; if(!body) return;
      var viz=document.createElement('div');
      viz.className='retrieval-viz';
      viz.innerHTML=buildRetrievalViz(meta, sources, rmeta);
      body.insertBefore(viz, at);   // 插入到流式答案文本之前, 不被 rAF 每帧重渲覆盖
      _vizMounted=true;
    }catch(_){ /* 可视化渲染失败绝不阻断主回答流 */ }
  }
  function buildRetrievalViz(meta, sources, rmeta){
    meta=meta||{};sources=sources||[];
    var routing=meta.routing_source||'';
    var routingLabel={'rule':'规则路由','hybrid':'混合路由','llm':'语义路由'}[routing]||routing||'路由';
    var kbId=meta.kb_id||'';
    var routerMs=(meta.router_ms!=null&&meta.router_ms!=='')?(' · '+Number(meta.router_ms).toFixed(1)+'ms'):'';
    var rerankCls='waiting', rerankTxt='重排中';
    if(rmeta&&rmeta.final){rerankCls='done';rerankTxt='重排完成';}
    else if(meta.rerank_ms>0){rerankCls='done';rerankTxt='重排 '+meta.rerank_ms+'ms';}
    else if((meta.degradation_level||0)===1){rerankCls='skip';rerankTxt='重排跳过';}
    var items=sources.map(function(s,i){
      var sc=Number(s.score||0);
      var pct=Math.max(2,Math.min(100,sc*100)).toFixed(1);
      var tier=sc>=0.7?'tier-high':(sc>=0.5?'tier-mid':'tier-low');
      var snip=RAG.escapeHtml((s.content||'').replace(/\s+/g,' ').trim().slice(0,140));
      var src=RAG.escapeHtml(((s.source_file||'')||(s.doc_id||'')).slice(-32)||'doc');
      return '<div class="rv-item '+tier+'" style="--d:'+(i*0.07).toFixed(2)+'s">'+
        '<div class="rv-row"><span class="rv-rank">'+(i+1)+'</span>'+
        '<span class="rv-score">'+sc.toFixed(3)+'</span>'+
        '<span class="rv-track"><span class="rv-fill" style="width:'+pct+'%"></span></span>'+
        '<span class="rv-src" title="'+src+'">'+src+'</span></div>'+
        (snip?'<div class="rv-snippet">'+snip+'</div>':'')+'</div>';
    }).join('');
    return '<div class="rv-head"><div class="rv-route">'+routingLabel+' → <b>'+RAG.escapeHtml(kbId)+
      '</b><span class="rv-ms">'+routerMs+'</span></div>'+
      '<div class="rv-stat"><span class="rv-count">召回 '+sources.length+' 篇</span>'+
      '<span class="rv-rerank '+rerankCls+'">'+rerankTxt+'</span></div></div>'+
      (items?'<div class="rv-bars">'+items+'</div>':'<div class="rv-empty">未召回相关片段</div>');
  }

  function handleError(msg){
    clearThinking();isStreaming=false;currentController=null;updateUIState(false);
    RAG.handleApiError?RAG.handleApiError('/qa/ask/stream',new Error(msg),true):RAG.toast('请求失败: '+msg,'err');
  }

  function stopGeneration(){
    if(currentController){currentController.abort();currentController=null;isStreaming=false;clearThinking();removeIncompleteAnswers();updateUIState(false);RAG.toast('已停止生成','warn',1500);}
  }

  function removeIncompleteAnswers(){
    var msgs=chatContainer.querySelectorAll('.msg-assistant');
    for(var i=0;i<msgs.length;i++){if(!msgs[i].querySelector('.actions-bar')&&!msgs[i].querySelector('.answer-actions'))msgs[i].remove();}
  }

  function updateUIState(streaming){
    sendBtn.disabled=streaming;
    if(streaming){sendBtn.classList.add('hidden');stopBtn.classList.add('show');}
    else{stopBtn.classList.remove('show');sendBtn.classList.remove('hidden');}
    questionInput.disabled=streaming;toggleSendBtn();
  }

  function toggleSendBtn(){var ht=!!questionInput.value.trim();sendBtn.disabled=ht?false:true;sendBtn.classList.toggle('active',ht);}
  function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,160)+'px';}
  var _scrollScheduled=false;
  var _autoScroll=true;          // 用户是否"贴底": 往上翻看历史时暂停自动滚动, 不被新 token 拽走
  function _onChatScroll(){
    if(!chatFlow)return;
    var nearBottom=chatFlow.scrollHeight-chatFlow.scrollTop-chatFlow.clientHeight<80;
    _autoScroll=nearBottom;
    if(scrollBottomBtn)scrollBottomBtn.hidden=_autoScroll;
  }
  function scrollToBottom(){
    if(_scrollScheduled)return;            // 同一帧内多次调用(流式每个 delta)只滚动一次
    _scrollScheduled=true;
    requestAnimationFrame(function(){_scrollScheduled=false;if(_autoScroll&&chatFlow)chatFlow.scrollTop=chatFlow.scrollHeight;});
  }
  function escapeAttr(s){return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  /* ── 长会话 DOM 裁剪: 防止 200+ 消息把 DOM 推到万级节点导致渲染/滚动卡顿 ──
   * 可见气泡上限 60 (用户+助手合计); 超出时移除最旧 .msg 并在顶部插入占位提示。
   * 仅裁剪视图, chatHistory 数组不裁(后端仍按最后 20 轮取上下文), 滚动到顶不会丢上下文。
   */
  var MAX_VISIBLE_MESSAGES=60;
  var _hiddenCount=0;
  function trimOldMessages(){
    var msgs=chatContainer.querySelectorAll('.msg');
    if(msgs.length<=MAX_VISIBLE_MESSAGES)return;
    var overflow=msgs.length-MAX_VISIBLE_MESSAGES;
    for(var i=0;i<overflow;i++){
      if(msgs[i]&&msgs[i].parentNode){
        var mid=msgs[i].id;if(mid)delete _answerCache[mid];   // 同步清理答案缓存, 防止长会话内存无限增长
        msgs[i].parentNode.removeChild(msgs[i]);
      }
    }
    _hiddenCount+=overflow;updateHiddenPlaceholder();
  }
  function updateHiddenPlaceholder(){
    var ph=document.getElementById('hiddenMsgsPh');
    if(_hiddenCount>0){
      if(!ph){ph=document.createElement('div');ph.id='hiddenMsgsPh';ph.className='hidden-msgs-ph';chatContainer.insertBefore(ph,chatContainer.firstChild);}
      ph.textContent='↑ 已隐藏较早的 '+_hiddenCount+' 条消息（上下文仍保留）';
    } else if(ph){ph.remove();}
  }

  window.askQuestion=askQuestion;window.stopGeneration=stopGeneration;

  // 测试钩子: 仅在 perf/harness 显式置位时暴露, 用于驱动真实消息路径做 DOM 裁剪验证
  // ══════════ 系统指标面板 (①切分策略 ②核心指标 ③单轮耗时 ④降级/异常分布) ══════════
  // 数据源: ① /api/v1/documents/type-strategies  ②③ /api/v1/metrics/summary
  //        ④ /api/v1/metrics/history (历史基线, 跨重启)
  var _metricsOverlay=null,_metricsBody=null,_metricsData=null,_stratData=null;

  function mEsc(s){return RAG.escapeHtml?RAG.escapeHtml(s):String(s==null?'':s);}
  function mPct(x){return ((Number(x)||0)*100);}

  function initMetricsPanel(){
    _metricsOverlay=document.getElementById('metricsOverlay');
    _metricsBody=document.getElementById('metricsBody');
    if(!_metricsOverlay)return;
    var openBtn=document.getElementById('metricsOpenBtn');
    if(openBtn){openBtn.innerHTML=RAG.icon('monitor');openBtn.addEventListener('click',openMetrics);}
    var closeBtn=document.getElementById('metricsCloseBtn');
    if(closeBtn){closeBtn.innerHTML=RAG.icon('x');closeBtn.addEventListener('click',closeMetrics);}
    var refBtn=document.getElementById('metricsRefreshBtn');
    if(refBtn){refBtn.innerHTML=RAG.icon('refresh');refBtn.addEventListener('click',function(){loadMetrics();});}
    _metricsOverlay.addEventListener('click',function(e){if(e.target===_metricsOverlay)closeMetrics();});
    document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!_metricsOverlay.hidden)closeMetrics();});
  }
  function openMetrics(){if(!_metricsOverlay)return;_metricsOverlay.hidden=false;loadMetrics();}
  function closeMetrics(){if(_metricsOverlay)_metricsOverlay.hidden=true;}

  async function loadMetrics(){
    if(!_metricsBody)return;
    _metricsBody.innerHTML='<div class="metrics-loading">正在加载指标…</div>';
    var rt=null,hist=null,strat=null,err=null;
    try{var r=await RAG.apiFetch('/api/v1/metrics/summary');rt=await r.json();}catch(e){err=err||e.message;}
    try{var h=await RAG.apiFetch('/api/v1/metrics/history');hist=await h.json();}catch(e){err=err||e.message;}
    try{var s=await RAG.apiFetch('/api/v1/documents/type-strategies');strat=await s.json();}catch(e){err=err||e.message;}
    if(!rt&&!hist&&!strat){
      _metricsBody.innerHTML='<div class="metrics-error">指标加载失败: '+mEsc(err||'未知错误')+'</div>';
      return;
    }
    _metricsData={rt:rt,hist:hist};_stratData=strat&&strat.items?strat.items:null;
    _metricsBody.innerHTML=renderMetrics(rt,hist,_stratData);
  }

  function renderMetrics(rt,hist,strategies){
    return renderSectionLatest()+renderSectionCore(rt,hist)+
           renderSectionDegradation(rt,hist)+renderSectionChunking(rt,strategies);
  }

  // ③ 本轮耗时与降级 (数据来自最后一次 SSE done 事件)
  function renderSectionLatest(){
    var h='<div class="metrics-section"><h3><span class="sec-idx">③</span>本轮耗时与降级</h3>';
    var d=window._ragLastDone;
    if(!d){h+='<div class="metrics-empty">本会话尚无已完成的问答 — 先发一条提问即可看到耗时拆解</div>';}
    else{h+=buildLatencyViz(d);}
    return h+'</div>';
  }

  // ② 核心指标 (实时进程内 + 历史基线对照)
  function renderSectionCore(rt,hist){
    var h='<div class="metrics-section"><h3><span class="sec-idx">②</span>核心指标</h3>';
    if(rt&&rt.ok){
      var req=rt.requests||{},lat=rt.latency_ms||{},q=rt.quality||{},c=rt.cache||{},sys=rt.system||{};
      h+='<div class="metric-sub">实时（本进程累计，重启清零）</div><div class="metric-cards">';
      h+=mCard('请求总数',req.total||0,'本进程累计');
      h+=mCard('成功率',mPct(req.success_rate||0).toFixed(1)+'%','success / total');
      h+=mCard('P50 延迟',fmtMs(lat.p50_ms),'样本 '+lat.count);
      h+=mCard('P95 延迟',fmtMs(lat.p95_ms),'样本 '+lat.count);
      h+=mCard('Top1 分数',(((q.top1_score||{}).avg)||0).toFixed(3),'首条检索相关性');
      h+=mCard('向量库',sys.vector_store_size||0,'条向量');
      h+=mCard('Embedding 缓存',mPct(c.embed_hit_rate||0).toFixed(1)+'%',(c.embed_hits||0)+'/'+(c.embed_hits+c.embed_misses||0));
      h+=mCard('QA 缓存',mPct(c.qa_hit_rate||0).toFixed(1)+'%',(c.qa_hits||0)+'/'+(c.qa_hits+c.qa_misses||0));
      h+='</div>';
      var st=rt.stages_ms||{},maxS=0;
      ['retrieval','rerank','llm'].forEach(function(k){maxS=Math.max(maxS,(st[k]||{}).avg_ms||0);});
      h+='<div class="metric-sub">阶段平均耗时</div><div class="stage-bars">';
      ['retrieval','rerank','llm'].forEach(function(k){
        var v=st[k]||{},w=maxS>0?((v.avg_ms||0)/maxS*100):0;
        h+='<div class="stage-row"><span class="stage-name">'+k+'</span>'+
           '<span class="stage-track"><span class="stage-fill" style="width:'+w.toFixed(1)+'%"></span></span>'+
           '<span class="stage-val">'+fmtMs(v.avg_ms)+' · n='+(v.count||0)+'</span></div>';
      });
      h+='</div>';
    }else{h+='<div class="metrics-empty">实时指标不可用</div>';}
    if(hist&&hist.available){
      var hl=hist.latency_ms||{},hd=hist.degradation||{},tk=hist.tokens||{};
      h+='<div class="metric-sub">历史基线（'+mEsc(hist.source||'')+'，'+hist.cases+' 条，跨重启）</div><div class="metric-cards">';
      h+=mCard('历史 P50',fmtMs(hl.p50),'有效样本 '+hl.samples);
      h+=mCard('历史 P95',fmtMs(hl.p95),'有效样本 '+hl.samples);
      h+=mCard('历史降级率',mPct(hd.degraded_rate||0).toFixed(1)+'%',(hd.degraded||0)+' / '+hd.total);
      h+=mCard('平均 tokens',tk.avg||0,'总计 '+(tk.total||0));
      h+='</div>';
      if(hist.range&&hist.range.from)h+='<div class="metrics-note">统计区间: '+mEsc(hist.range.from)+' → '+mEsc(hist.range.to)+'</div>';
    }else{
      h+='<div class="metrics-empty">历史基线不可用'+(hist&&hist.reason?('（'+mEsc(hist.reason)+'）'):'')+'</div>';
    }
    return h+'</div>';
  }
  function mCard(label,value,sub){
    return '<div class="metric-card"><div class="mc-label">'+mEsc(label)+'</div>'+
      '<div class="mc-value">'+mEsc(value)+'</div><div class="mc-sub">'+mEsc(sub||'')+'</div></div>';
  }

  // ④ 异常与降级兜底 (历史为主 + 实时对照)
  function renderSectionDegradation(rt,hist){
    var h='<div class="metrics-section"><h3><span class="sec-idx">④</span>异常与降级兜底</h3>';
    if(hist&&hist.available&&hist.degradation){
      var d=hist.degradation,lv=d.levels||{},lb=d.level_labels||{},tot=d.total||0,maxV=0;
      Object.keys(lv).forEach(function(k){maxV=Math.max(maxV,lv[k]||0);});
      h+='<div class="metric-sub">降级等级分布（历史 '+tot+' 条）</div><div class="deg-chart">';
      Object.keys(lv).sort().forEach(function(k){
        var n=lv[k]||0,w=maxV>0?(n/maxV*100):0;
        h+='<div class="deg-row"><span class="deg-key">L'+k+'</span>'+
          '<span class="deg-name">'+mEsc(lb[k]||'')+'</span>'+
          '<span class="deg-track"><span class="deg-fill deg-l'+k+'" style="width:'+w.toFixed(1)+'%"></span></span>'+
          '<span class="deg-val">'+n+' <i>('+(tot?(n/tot*100).toFixed(1):0)+'%)</i></span></div>';
      });
      h+='</div>';
      var tr=hist.trend||[];
      if(tr.length){
        var maxC=0;tr.forEach(function(t){maxC=Math.max(maxC,t.cases||0);});
        h+='<div class="metric-sub">按天趋势（柱高=问答量，下方百分比=当日降级率）</div><div class="trend-chart">';
        tr.forEach(function(t){
          var bh=maxC>0?((t.cases/maxC)*100):0;
          h+='<div class="trend-col" title="'+mEsc(t.date)+' · '+t.cases+' 条 · 降级 '+t.degraded+' 条 · 均 '+fmtMs(t.avg_latency_ms)+'">'+
            '<span class="trend-bar-wrap"><span class="trend-bar" style="height:'+bh.toFixed(1)+'%"></span></span>'+
            '<span class="trend-date">'+mEsc((t.date||'').slice(5))+'</span>'+
            '<span class="trend-rate">'+mPct(t.degraded_rate||0).toFixed(0)+'%</span></div>';
        });
        h+='</div>';
      }
      var rs=(hist.routing||{}).sources||{},rtot=(hist.routing||{}).total||0;
      if(rtot){
        h+='<div class="metric-sub">路由来源分布</div><div class="chip-row">';
        Object.keys(rs).forEach(function(k){
          h+='<span class="chip">'+mEsc(k)+' <b>'+rs[k]+'</b> <i>'+(rtot?(rs[k]/rtot*100).toFixed(1):0)+'%</i></span>';
        });
        h+='</div>';
      }
      var dq=hist.data_quality||{};
      h+='<div class="metrics-note">⚠ 数据口径: '+mEsc(dq.note||'')+
        ' 零延迟样本 '+dq.zero_latency+' 条、探针请求 '+dq.probe_like+' 条、忠实度缺失 '+
        dq.faithfulness_missing+' 条 — 均已剔除或单列，不混入均值。</div>';
    }else{h+='<div class="metrics-empty">历史降级数据不可用</div>';}
    if(rt&&rt.ok&&rt.degradation){
      var rd=rt.degradation,rl=rd.levels||{},rdl=rd.level_labels||{},rdt=rd.total||0;
      h+='<div class="metric-sub">实时降级分布（本进程 '+rdt+' 条）</div><div class="chip-row">';
      Object.keys(rl).sort().forEach(function(k){
        h+='<span class="chip deg-l'+k+'">L'+k+' '+mEsc(rdl[k]||'')+' <b>'+rl[k]+'</b></span>';
      });
      h+='</div>';
    }
    return h+'</div>';
  }

  // ① 文档类型 × 切分策略
  function renderSectionChunking(rt,strategies){
    var h='<div class="metrics-section"><h3><span class="sec-idx">①</span>文档类型 × 切分策略</h3>';
    if(!strategies||!strategies.length){return h+'<div class="metrics-empty">策略数据不可用</div></div>';}
    var st=(rt&&rt.chunking&&rt.chunking.by_type)||{};
    h+='<div class="strat-grid">';
    strategies.forEach(function(s){
      var c=s.chunker||{},real=st[s.type_id];
      h+='<div class="strat-card'+(c.strategy&&c.strategy!=='semantic'?' strat-hl':'')+'">'+
        '<div class="sc-head"><span class="sc-label">'+mEsc(s.label)+'</span>'+
        '<span class="sc-type">'+mEsc(s.type_id)+'</span></div>'+
        '<div class="sc-strategy strat-'+mEsc(c.strategy||'semantic')+'">'+mEsc(c.strategy_label||c.strategy||'')+'</div>'+
        '<div class="sc-meta">'+
          '<span>块上限 <b>'+(c.max_chars||0)+'</b> 字</span>'+
          '<span>重叠 <b>'+(c.overlap||0)+'</b> 字</span>'+
          '<span>表格感知 <b>'+(s.parse&&s.parse.table?'是':'否')+'</b></span>'+
          '<span>路由词 <b>'+(s.routing_keywords_count||0)+'</b></span>'+
        '</div>'+
        '<div class="sc-why">'+mEsc(c.rationale||'')+'</div>'+
        (real?('<div class="sc-real">实测: '+real.docs+' 篇 / '+real.chunks+' 块 · 均 '+real.avg_chunk_chars+' 字每块</div>')
             :'<div class="sc-real muted">本进程暂无切分记录</div>')+
      '</div>';
    });
    h+='</div><div class="metrics-note">策略取自后端单一事实来源 <code>engines/doc_types.py</code>；'+
       '实测统计来自进程内切分指标（重启清零），未上传文档时为空属正常。</div>';
    return h+'</div>';
  }

  if(window.__RAG_TEST__){
    window.RAG_TEST={
      appendUserMessage:appendUserMessage,
      appendRestoredAssistantMessage:appendRestoredAssistantMessage,
      createStreamingCard:createStreamingCard,
      updateStreamingAnswer:updateStreamingAnswer,
      finalizeAnswer:finalizeAnswer,
      getStreamNode:function(){return _streamNode;},
      getStreamFull:function(){return _streamFull;},
      setAutoScroll:function(v){_autoScroll=v;},
      getAutoScroll:function(){return _autoScroll;},
      scrollToBottom:scrollToBottom,
      getAnswerCacheSize:function(){return Object.keys(_answerCache).length;},
      regenerate:regenerate,
      buildRetrievalViz:buildRetrievalViz,
      mountRetrievalViz:mountRetrievalViz,
      getPipelineState:function(){
        var cards=document.querySelectorAll('.msg-assistant .pipeline-steps');
        var el=cards.length?cards[cards.length-1]:document.getElementById('pipelineSteps');
        if(!el)return null;var o={};el.querySelectorAll('.pstep').forEach(function(n){o[n.getAttribute('data-step')]=n.className.replace('pstep','').trim();});return o;
      },
      trimOldMessages:trimOldMessages,
      getMessageCount:function(){return chatContainer.querySelectorAll('.msg').length;},
      getHiddenCount:function(){return _hiddenCount;},
      MAX_VISIBLE_MESSAGES:MAX_VISIBLE_MESSAGES
    };
  }

  document.addEventListener('DOMContentLoaded',init);
})();
</script>
</body>
</html>
