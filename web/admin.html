<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6366f1">
<title>RAG 2.0 — 管理后台</title>
<link rel="icon" href="data:,">
<script>
  (function(){
    try {
      var t = localStorage.getItem('rag_theme');
      if (t !== 'light' && t !== 'dark') {
        t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', t);
    } catch(e) { document.documentElement.setAttribute('data-theme', 'light'); }
  })();
</script>
<link rel="stylesheet" href="/web/common.css">
<style>
/* Admin page override: force light even when system preference is dark */
@media (prefers-color-scheme: dark) {
  [data-theme="system"], [data-theme="light"] { --bg-deep:#f1f5f9; --bg-surface:#ffffff; --bg-card:rgba(255,255,255,.95); --bg-card-hover:#f8fafc; --border-subtle:rgba(0,0,0,.06); --border-card:rgba(0,0,0,.08); --text:#0f172a; --text-2:#475569; --text-3:#94a3b8; --shadow-card:0 4px 24px rgba(0,0,0,.06),0 0 0 1px rgba(0,0,0,.06); --shadow-glow:none; }
}
</style>
</head>
<body>
<nav class="navbar">
  <div class="navbar-inner">
    <div class="brand"><span class="logo"><i class="fa fa-cubes"></i></span> RAG 2.0 · 管理后台</div>
    <div class="spacer"></div>
    <a class="btn-ghost" href="/" aria-label="返回对话"><i class="fa fa-commenting-o"></i> 返回对话</a>
    <button class="icon-btn" id="themeToggle" title="切换主题" aria-label="切换主题"><i class="fa fa-moon-o"></i></button>
  </div>
</nav>

<main>
  <div class="page-title">系统管理后台</div>
  <div class="page-sub">身份权限 · 文档管理 · 质量观测　<span id="apiStatus" role="status"></span></div>

  <div class="grid">
    <!-- 身份权限 -->
    <section class="card" id="card-auth">
      <h2><i class="fa fa-id-card"></i> 当前身份与权限</h2>
      <div class="apikey-row">
        <input id="apiKeyInput" type="text" placeholder="可选：填入 X-API-Key 后点保存" aria-label="API Key" />
        <button class="btn sm" id="saveKey"><i class="fa fa-floppy-o"></i> 保存</button>
      </div>
      <div id="authBody"><div class="empty-tip"><i class="fa fa-spinner fa-spin"></i> 加载中...</div></div>
    </section>

    <!-- 质量指标 -->
    <section class="card" id="card-metrics">
      <h2><i class="fa fa-line-chart"></i> 问答质量指标</h2>
      <div class="metrics-grid" id="metricsGrid"><div class="empty-tip"><i class="fa fa-spinner fa-spin"></i> 解析 /metrics ...</div></div>
      <div class="deg-list" id="degList"></div>
    </section>

    <!-- 上传 -->
    <section class="card" id="card-upload">
      <h2><i class="fa fa-cloud-upload"></i> 上传文档</h2>
      <div class="upload-zone" id="dropZone">
        <i class="fa fa-file-o"></i>
        <div>点击或拖拽文件到此处</div>
        <div style="font-size:12px;margin-top:4px;color:var(--text-3)">PDF / Word / 图片 / 文本 等</div>
        <input type="file" id="fileInput" style="display:none" />
      </div>
      <div class="file-name" id="selectedFile" style="display:none"></div>
      <div class="form-row">
        <select id="kbSelect">
          <option value="documents">默认库 (documents)</option>
          <option value="service">客服话术库 (service)</option>
          <option value="tech">技术文档库 (tech)</option>
        </select>
        <button class="btn-primary" id="uploadBtn" disabled><i class="fa fa-rocket"></i> 上传并解析</button>
      </div>
      <div id="uploadResult"></div>
    </section>

    <!-- 文档列表 -->
    <section class="card" id="card-docs">
      <h2><i class="fa fa-folder-open"></i> 文档列表 <span class="doc-id" id="docCount"></span></h2>
      <div id="docList"><div class="empty-tip"><i class="fa fa-spinner fa-spin"></i> 加载中...</div></div>
    </section>
  </div>
</main>

<script src="/web/common.js"></script>
<script src="/web/icons.js"></script>
<script src="/web/markdown.js"></script>
<script>
// 依赖: /web/common.js /web/icons.js /web/markdown.js (上方已同步加载)
// 兜底实现: 公共资源缺失(静态预览/纯静态托管)时页面降级为"可用但明确报错", 而非整页 JS 死亡
const RAG = window.RAG;
const HAS_COMMON = !!(RAG && RAG.apiFetch && RAG.icon);
const API = (RAG && RAG.API) || '/api/v1';

// 公共资源缺失时的可见提示(替代静默 throw)
if (!HAS_COMMON) {
  try {
    const bar = document.createElement('div');
    bar.style.cssText = 'position:sticky;top:0;z-index:99;background:#b45309;color:#fff;text-align:center;padding:8px 12px;font-size:13px;';
    bar.textContent = '⚠️ 前端公共资源未加载（/web/*.js 404）——请通过后端服务访问：python -m uvicorn api.main:app';
    document.body.prepend(bar);
  } catch(e) {}
}

// ── 初始化 ──
document.getElementById('apiKeyInput').value = localStorage.getItem('rag_api_key') || '';
document.getElementById('saveKey').onclick = () => {
  const k = document.getElementById('apiKeyInput').value.trim();
  localStorage.setItem('rag_api_key', k);
  loadIdentity(); loadDocs(); loadMetrics();
};
(async () => {
  try {
    await fetch('/health', {headers: RAG.authHeaders()});
    document.getElementById('apiStatus').innerHTML = '<span class="status-dot dot-ok"></span>API 在线';
  } catch(e) { document.getElementById('apiStatus').innerHTML = '<span class="status-dot dot-err"></span>API 离线'; }
  loadIdentity(); loadDocs(); loadMetrics();
})();

// ── 身份权限 ──
async function loadIdentity() {
  const el = document.getElementById('authBody');
  try {
    const r = await RAG.apiFetch(API + '/auth/me', {headers: RAG.authHeaders()});
    const p = await r.json();
    const roleBadge = p.is_admin ? '<span class="badge badge-admin">admin</span>' : '<span class="badge badge-reader">reader</span>';
    const kbs = (p.allowed_kbs == null) ? '<span class="badge badge-ok">全部知识库</span>' : (p.allowed_kbs.length ? p.allowed_kbs.map(k => `<span class="doc-kb">${RAG.escapeHtml(k)}</span>`).join(' ') : '<span class="badge badge-danger">无权限</span>');
    el.innerHTML = `
      <div class="kv"><span class="k">Key 标识</span><span class="v">${RAG.escapeHtml(p.key_id)}</span></div>
      <div class="kv"><span class="k">名称</span><span class="v">${RAG.escapeHtml(p.name)}</span></div>
      <div class="kv"><span class="k">角色</span><span class="v">${roleBadge}</span></div>
      <div class="kv"><span class="k">可访问知识库</span><span class="v" style="text-align:right;display:block;margin-top:6px">${kbs}</span></div>`;
  } catch(e) { el.innerHTML = `<div class="alert alert-danger">${RAG.icon('x-circle')} 加载失败: ${RAG.escapeHtml(e.message)}</div>`; }
}

// ── 质量指标 (解析 Prometheus /metrics) ──
async function loadMetrics() {
  const grid = document.getElementById('metricsGrid');
  const deg = document.getElementById('degList');
  try {
    const r = await fetch('/metrics', {headers: RAG.authHeaders()});
    const text = await r.text();
    const m = {};
    text.split('\n').forEach(line => {
      if (line.startsWith('#')) return;
      const idx = line.indexOf(' ');
      if (idx < 0) return;
      const nameLbl = line.slice(0, idx);
      const val = parseFloat(line.slice(idx + 1).trim());
      if (isNaN(val)) return;
      const name = nameLbl.split('{')[0];
      if (name === 'rag_degradation_levels_total') {
        const lm = nameLbl.match(/level="([^"]+)"/);
        const lvl = lm ? lm[1] : '?';
        (m.deg = m.deg || {})[lvl] = (m.deg[lvl] || 0) + val;
      } else if (name.startsWith('rag_qa_faithfulness') || name.startsWith('rag_qa_top1_score')) {
        if (name.includes('faithfulness') && name.endsWith('_sum')) m.faithSum = (m.faithSum||0) + val;
        if (name.includes('faithfulness') && name.endsWith('_count')) m.faithCnt = (m.faithCnt||0) + val;
        if (name.includes('top1_score') && name.endsWith('_sum')) m.top1Sum = (m.top1Sum||0) + val;
        if (name.includes('top1_score') && name.endsWith('_count')) m.top1Cnt = (m.top1Cnt||0) + val;
      }
    });
    const faith = (m.faithCnt > 0) ? (m.faithSum / m.faithCnt) : null;
    const top1 = (m.top1Cnt > 0) ? (m.top1Sum / m.top1Cnt) : null;
    const cards = [
      {num: faith == null ? '—' : (faith*100).toFixed(1)+'%', lbl: '平均忠实度'},
      {num: top1 == null ? '—' : (top1*100).toFixed(1)+'%', lbl: '平均 Top1 得分'},
      {num: m.faithCnt || 0, lbl: '已评估问答数'},
      {num: Object.values(m.deg||{}).reduce((a,b)=>a+b,0) || 0, lbl: '降级触发次数'},
    ];
    grid.innerHTML = cards.map(c => `<div class="metric"><div class="num">${c.num}</div><div class="lbl">${c.lbl}</div></div>`).join('');
    if (m.deg && Object.keys(m.deg).length) {
      deg.innerHTML = '<span style="font-size:12px;color:var(--text-3)">降级层级分布：</span>' +
        Object.entries(m.deg).map(([k,v]) => `<span class="badge badge-warn">L${RAG.escapeHtml(k)}: ${v}</span>`).join(' ');
    } else { deg.innerHTML = ''; }
  } catch(e) { grid.innerHTML = `<div class="alert alert-danger" style="grid-column:1/-1">${RAG.icon('x-circle')} 指标加载失败: ${RAG.escapeHtml(e.message)}</div>`; }
}

// ── 上传 ──
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
let selectedFile = null;
dropZone.onclick = () => fileInput.click();
dropZone.ondragover = e => { e.preventDefault(); dropZone.classList.add('dragover'); };
dropZone.ondragleave = () => dropZone.classList.remove('dragover');
dropZone.ondrop = e => { e.preventDefault(); dropZone.classList.remove('dragover'); if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]); };
fileInput.onchange = e => { if (e.target.files.length) handleFile(e.target.files[0]); };
function handleFile(f) {
  selectedFile = f;
  document.getElementById('selectedFile').style.display = 'block';
  document.getElementById('selectedFile').textContent = '已选：' + f.name;
  document.getElementById('uploadBtn').disabled = false;
}
function handleFileReset() {
  selectedFile = null;
  document.getElementById('selectedFile').style.display = 'none';
  fileInput.value = '';
}
document.getElementById('uploadBtn').onclick = async () => {
  if (!selectedFile) { alert('请先选择要上传的文件'); return; }
  // 文件大小校验 ≤50MB
  if (selectedFile.size > 50 * 1024 * 1024) {
    RAG.toast('文件过大：' + RAG.formatBytes(selectedFile.size) + '，上限 50MB', 'err');
    handleFileReset(); return;
  }
  // 文件类型白名单
  const allowed = /\.(pdf|md|markdown|txt|docx)$/i;
  if (!allowed.test(selectedFile.name)) {
    RAG.toast('不支持的文件格式，请上传 PDF / Markdown / TXT / DOCX', 'err');
    handleFileReset(); return;
  }
  const btn = document.getElementById('uploadBtn');
  btn.disabled = true; btn.innerHTML = RAG.icon('spinner', true) + ' 解析中...';
  const fd = new FormData(); fd.append('file', selectedFile); fd.append('knowledge_base', document.getElementById('kbSelect').value);
  try {
    const r = await RAG.apiFetch(API + '/documents/upload', {method:'POST', body: fd, headers: RAG.authHeaders()});
    const data = await r.json();
    document.getElementById('uploadResult').innerHTML = `<div class="alert alert-success">${RAG.icon('check-circle')} 上传成功 · ID <code>${RAG.escapeHtml(data.doc_id)}</code> · 状态 ${RAG.escapeHtml(data.status)}</div>`;
    handleFileReset(); loadDocs(); startPolling();
  } catch(e) {
    document.getElementById('uploadResult').innerHTML = `<div class="alert alert-danger">${RAG.icon('x-circle')} 上传失败: ${RAG.escapeHtml(e.message)}</div>`;
  }
  btn.disabled = false; btn.innerHTML = RAG.icon('rocket') + ' 上传并解析';
};

// ── 文档列表 + 轮询 ──
let polling = false;
async function loadDocs() {
  const el = document.getElementById('docList');
  try {
    const r = await RAG.apiFetch(API + '/documents', {headers: RAG.authHeaders()});
    const data = await r.json();
    document.getElementById('docCount').textContent = '共 ' + data.total + ' 篇';
    if (!data.items.length) { el.innerHTML = '<div class="empty-tip">暂无文档，请先上传</div>'; return; }
    el.innerHTML = data.items.map(d => `
      <div class="doc-row">
        <div class="doc-left">
          <span class="doc-status ${RAG.escapeHtml(d.status)}"></span>
          <span class="doc-name" title="${RAG.escapeHtml(d.filename)}">${RAG.escapeHtml(d.filename)}</span>
          <span class="doc-kb">${RAG.escapeHtml(d.knowledge_base || 'documents')}</span>
        </div>
        <div class="doc-right">
          <span class="doc-id">${RAG.escapeHtml((d.doc_id||'').slice(-8))}</span>
          <button class="del-btn" title="删除" aria-label="删除文档" data-doc-id="${RAG.escapeHtml(d.doc_id)}">${RAG.icon('trash')}</button>
        </div>
      </div>`).join('');
  } catch(e) { el.innerHTML = `<div class="empty-tip" style="color:var(--danger)">加载失败: ${RAG.escapeHtml(e.message)}</div>`; }
}
function startPolling() {
  if (polling) return; polling = true;
  const timer = setInterval(async () => {
    await loadDocs();
    try {
      const r = await RAG.apiFetch(API + '/documents', {headers: RAG.authHeaders()});
      const data = await r.json();
      const stillProcessing = (data.items || []).some(d => d.status === 'processing');
      if (!stillProcessing) { clearInterval(timer); polling = false; }
    } catch(e) { clearInterval(timer); polling = false; }
  }, 2500);
}
document.addEventListener('click', (e) => {
  const btn = e.target.closest('.del-btn');
  if (btn) {
    const id = btn.dataset.docId;
    if (!confirm('确认删除文档 ' + id + ' ?\n将同步清理向量和检索索引')) return;
    (async () => { try { await RAG.apiFetch(API + '/documents/' + id, {method:'DELETE', headers: RAG.authHeaders()}); loadDocs(); } catch(e) { alert('删除失败: ' + e.message); } })();
  }
});

// 指标每 15s 刷新一次
setInterval(loadMetrics, 15000);
</script>
</body>
</html>
