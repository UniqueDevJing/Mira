# Mira（基于 RAG 的可信问答系统）— nginx 站点配置
#
# 部署形态：一个站点 + 多路径前缀（这台服务器安全组只放行 22/80，不能新开端口）
#   /mira/          知识问答主体        → 127.0.0.1:8001
#   /mira/verify/   金融校验演示 + MCP  → 127.0.0.1:8002
#
# 用法：主 server 块内 `include /etc/nginx/mira-locations.conf;`
#      （本文件内容即为线上实际生效版本，改动后请与线上保持同步）
#
# ⚠️ 三条必须遵守的约束（都踩过坑）：
#
# 1) 静态资源交给 nginx 直出，不要走 proxy
#    全局 `gzip on;` 只压默认的 text/html，且**代理响应受 gzip_proxied（默认 off）限制**，
#    所以走 proxy 的 HTML/CSS/JS 根本不会被压缩。让 nginx 直接读磁盘才能吃到 gzip。
#
# 2) SSE 与 MCP 所在 location 必须 `gzip off` 且 `proxy_buffering off`
#    /mira/api/v1/qa/ask/stream 是 text/event-stream；MCP 的 streamable-http 也可能回
#    text/event-stream。压缩或缓冲都会把流掐死。
#
# 3) 静态直出的两个细节
#    - `location = /x/` 里 alias 必须指**目录**（指文件会被追加 index 变成
#      `index.htmlindex.html`）；而 `index` 会内部重定向到 `/x/index.html`，
#      该 URI 必须被显式接住，否则会落进代理的 catch-all 转给后端 → 404
#    - URI 无扩展名（如 `/x/admin`）nginx 推断不出 MIME，会变成
#      application/octet-stream → 浏览器下载而非渲染，需 `default_type text/html`
#
# 依赖的全局 gzip 配置（在 nginx.conf 的 http 块内）：
#     gzip on;
#     gzip_vary on;
#     gzip_comp_level 5;
#     gzip_min_length 1024;
#     # 显式排除 text/event-stream
#     gzip_types text/plain text/css application/javascript application/json
#                application/xml image/svg+xml;

# ── 统一入口跳转 ──

# ── 与线上 /etc/nginx/mira-locations.conf 保持一致（同步日期 2026-09-30）──
# Mira：知识问答（8001）。金融数值校验护栏在应用内部（api/core/finance_guard.py），
# 不再对外暴露校验演示页与 MCP 端点（2026-09-30 按需求移除，备份见 /root/mira-verify-removal-*）。
location = /mira { return 301 /mira/; }

# ── 静态首屏与资源：nginx 直出磁盘，不经 Python ──
# 收益：省掉一次应用层转发；可压缩；带 ETag 协商缓存
location = /mira/ {
    # index 会内部重定向到 /mira/index.html，故 alias 指向目录、下方再精确接住该 URI
    alias /opt/mira/web/;
    index index.html;
    add_header Cache-Control "no-cache" always;
    access_log off;
}

# 接住上面 index 的内部重定向；URI 不以 / 结尾，alias 可直接指向文件
location = /mira/index.html {
    alias /opt/mira/web/index.html;
    add_header Cache-Control "no-cache" always;
    access_log off;
}

location = /mira/admin {
    alias /opt/mira/web/admin.html;
    # URI 无 .html 后缀，nginx 推断不出 MIME，必须显式声明，否则浏览器会下载而非渲染
    default_type text/html;
    add_header Cache-Control "no-cache" always;
    access_log off;
}

location /mira/web/ {
    alias /opt/mira/web/;
    add_header Cache-Control "no-cache" always;
    access_log off;
}


# 校验演示页与 MCP 端点已下线：显式 404，避免落到下方 /mira/ 的 catch-all 被后端接走
location /mira/verify/ { return 404; }
location = /mira/verify { return 404; }

# ── 问答 API（含 SSE 流式 /api/v1/qa/ask/stream）：禁压 ──
location /mira/api/ {
    gzip off;
    proxy_pass http://127.0.0.1:8001/api/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}

location /mira/ {
    gzip off;
    proxy_pass http://127.0.0.1:8001/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;              # SSE 流式问答
    proxy_read_timeout 300s;
    client_max_body_size 20m;
}
